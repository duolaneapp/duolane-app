name: Publish release

# A new version arrives as files on the "incoming" branch (dist/*, TAG, NOTES.md).
# This turns them into a public release with fixed file names, so the links
#   https://github.com/duolaneapp/duolane-app/releases/latest/download/<file>
# always point at the newest version, then removes the branch.
on:
  push:
    branches: [incoming]

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: incoming

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(tr -d '\r\n ' < TAG)
          { cat NOTES.md; echo; echo '### SHA-256'; echo '```'; cat dist/SHA256SUMS.txt; echo '```'; } > body.md
          gh release create "$TAG" dist/* --title "Duolane $TAG" --notes-file body.md --latest --target main

      - name: Remove the incoming branch
        if: always()
        run: git push origin --delete incoming
